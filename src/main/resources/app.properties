# Настройки приложения. Файл в кодировке UTF-8.
# Любой параметр можно удалить или закомментировать: тогда берётся значение по умолчанию.
# Подключение к базе данных настраивается отдельно, в database.properties.

# ---- Алгоритм составления расписания ----

# Больше стольких пар в день у одной группы не бывает (жёсткое правило, от 1 до 8)
solver.maxPairsPerDay=6

# Штрафы за неудобство: чем больше число, тем сильнее алгоритм избегает этого.
# Окно у студентов (пустая пара между занятиями)
solver.weight.studentWindow=10
# Окно у преподавателя
solver.weight.teacherWindow=5
# Занятие позже 4 пары
solver.weight.latePair=2
# Занятие в субботу
solver.weight.saturday=15
# Слишком большая аудитория для группы
solver.weight.roomSlack=3
# Перегруженный день у группы
solver.weight.dayLoad=4

# Сколько раз алгоритм пробует освободить место, вытеснив уже поставленные занятия
solver.repairRounds=3
solver.maxEjectionsPerSeries=3

# Ограничение времени работы алгоритма, секунд
solver.timeLimitSeconds=60

# ---- Данные и интерфейсы ----

# Номер семестра в таблице academic_semesters
semester.id=1

# Порт сайта (если занят, будет выбран следующий свободный)
web.port=8080

# Папка для экспорта расписаний в CSV из консольного меню
export.directory=.
